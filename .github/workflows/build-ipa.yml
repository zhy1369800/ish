name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 Release'
        required: false
        default: false
        type: boolean

      release_tag:
        description: 'Release 标签（如 v1.3.3）'
        required: false
        default: ''
        type: string

      prerelease:
        description: '是否为预发布版本 (Pre-release)'
        required: false
        default: false
        type: boolean

jobs:
  ios-ipa:
    name: 构建 iOS IPA
    runs-on: macos-14
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: 🔧 安装构建依赖
        run: |
          brew install llvm lld ninja libarchive meson
          echo "/opt/homebrew/bin:/usr/local/bin" >> $GITHUB_PATH

      - name: 📝 获取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'MARKETING_VERSION' app/Project.xcconfig | head -n 1 | awk '{print $3}' | tr -d '\r\n')
          if [ -z "$VERSION" ]; then
            VERSION="1.3.3"
          fi
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            VERSION="${TAG#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本号: $VERSION"

      - name: 🏗️ 构建 iOS (无签名)
        run: |
          xcodebuild build \
            -project iSH.xcodeproj \
            -scheme iSH \
            -configuration Release \
            -arch arm64 \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_PRODUCT=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0

          cd build/DerivedData/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r iSH.app Payload/
          zip -qr "../../../../iSH_${VERSION}.ipa" Payload
          cd -

      - name: 🚀 发布到 Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: iSH_*.ipa

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: iSH-IPA
          path: iSH_*.ipa
